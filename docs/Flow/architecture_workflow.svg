<?xml version="1.0" encoding="UTF-8" standalone="no"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    width="1800"
    height="2600"
    viewBox="0 0 1800 2500">

<defs>

    <!-- Background Gradient -->

    <linearGradient id="bgGradient"
        x1="0%"
        y1="0%"
        x2="100%"
        y2="100%">

        <stop offset="0%" stop-color="#F8FAFC"/>
        <stop offset="100%" stop-color="#EEF5FF"/>

    </linearGradient>

    <!-- Card Gradient -->

    <linearGradient id="cardGradient"
        x1="0%"
        y1="0%"
        x2="100%"
        y2="100%">

        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="100%" stop-color="#F3F7FB"/>

    </linearGradient>

    <!-- Blue Gradient -->

    <linearGradient id="blueGradient"
        x1="0%"
        y1="0%"
        x2="100%"
        y2="100%">

        <stop offset="0%" stop-color="#2563EB"/>
        <stop offset="100%" stop-color="#1D4ED8"/>

    </linearGradient>

    <!-- Green Gradient -->

    <linearGradient id="greenGradient"
        x1="0%"
        y1="0%"
        x2="100%"
        y2="100%">

        <stop offset="0%" stop-color="#16A34A"/>
        <stop offset="100%" stop-color="#15803D"/>

    </linearGradient>

    <!-- Orange Gradient -->

    <linearGradient id="orangeGradient"
        x1="0%"
        y1="0%"
        x2="100%"
        y2="100%">

        <stop offset="0%" stop-color="#F97316"/>
        <stop offset="100%" stop-color="#EA580C"/>

    </linearGradient>

    <!-- Shadow -->

    <filter id="shadow"
        x="-20%"
        y="-20%"
        width="140%"
        height="140%">

        <feDropShadow
            dx="0"
            dy="8"
            stdDeviation="8"
            flood-color="#000000"
            flood-opacity="0.18"/>

    </filter>

    <!-- Arrow -->

    <marker
        id="arrow"
        markerWidth="12"
        markerHeight="12"
        refX="8"
        refY="4"
        orient="auto">

        <path
            d="M0,0 L8,4 L0,8 Z"
            fill="#2563EB"/>

    </marker>

</defs>

<!-- Background -->

<rect
    x="0"
    y="0"
    width="1800"
    height="2300"
